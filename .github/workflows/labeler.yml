name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs with write access, so this job never checks out or runs PR code.
      - uses: actions/labeler@v5
        with:
          sync-labels: true
