name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format (swift-format)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Lint
        run: xcrun swift-format lint --strict --recursive Sources Tests

  package-macos:
    name: Package (macOS host, warnings as errors)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

  package-ios:
    name: Package (iOS Simulator, with coverage)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Test
        run: |
          xcodebuild test \
            -scheme SwiftExtension \
            -destination "id=$SIM_UDID" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Coverage summary
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            {
              echo "### Code coverage"
              echo '```'
              xcrun xccov view --report --only-targets TestResults.xcresult
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult

  example:
    name: Example app (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          xcodebuild test \
            -project Example/Swift-Extension.xcodeproj \
            -scheme Swift-Extension \
            -destination "id=$SIM_UDID" \
            -only-testing:Swift-ExtensionTests \
            CODE_SIGNING_ALLOWED=NO

  docs:
    name: Documentation (DocC)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build documentation
        run: |
          xcodebuild docbuild \
            -scheme SwiftExtension \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  ci-success:
    name: CI success
    if: always()
    needs: [format, package-macos, package-ios, example, docs]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to pass
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required job failed."
            exit 1
          fi
