name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (Swift)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual
      - name: Build for iOS so UIKit and SwiftUI code is analyzed
        run: |
          xcodebuild build \
            -scheme SwiftExtension \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
